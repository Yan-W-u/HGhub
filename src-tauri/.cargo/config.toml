# Android 交叉编译配置（本机 NDK 27.0.12077973，minSdk 24）
# Windows 上 tauri-cli / cargo-mobile2 用符号链接把 .so 放进 jniLibs，
# 没有开发者模式会失败；本配置只负责让 cargo 自己编出 .so，链接与拷贝由 build-android.ps1 完成。

[target.aarch64-linux-android]
linker = "D:\\Android\\Sdk\\ndk\\27.0.12077973\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\aarch64-linux-android24-clang.cmd"
rustflags = ["-Clink-arg=-landroid", "-Clink-arg=-llog", "-Clink-arg=-lOpenSLES"]

[target.armv7-linux-androideabi]
linker = "D:\\Android\\Sdk\\ndk\\27.0.12077973\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\armv7a-linux-androideabi24-clang.cmd"
rustflags = ["-Clink-arg=-landroid", "-Clink-arg=-llog", "-Clink-arg=-lOpenSLES"]

[target.i686-linux-android]
linker = "D:\\Android\\Sdk\\ndk\\27.0.12077973\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\i686-linux-android24-clang.cmd"
rustflags = ["-Clink-arg=-landroid", "-Clink-arg=-llog", "-Clink-arg=-lOpenSLES"]

[target.x86_64-linux-android]
linker = "D:\\Android\\Sdk\\ndk\\27.0.12077973\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\x86_64-linux-android24-clang.cmd"
rustflags = ["-Clink-arg=-landroid", "-Clink-arg=-llog", "-Clink-arg=-lOpenSLES"]

[net]
git-fetch-with-cli = true

[http]
check-revoke = false
